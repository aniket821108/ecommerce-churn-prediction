services:
  - type: web
    name: eshop
    runtime: docker
    dockerfilePath: ./Dockerfile
    repo: https://github.com/aniket821108/ecommerce-churn-prediction
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_COOKIE_EXPIRE
        value: "7"
      - key: FRONTEND_URL
        sync: false  # Set to your Render URL after deploy
      - key: ALLOWED_ORIGINS
        sync: false  # Set to your Render URL after deploy
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PYTHON_CMD
        value: python3
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "1000"
      # Build-time args for frontend
      - key: VITE_API_URL
        sync: false  # Set to your Render URL + /api (e.g., https://eshop-xxxx.onrender.com/api)
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
